[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tishineng-running"
version = "0.2.0"
description = "体适能跑步数据仿真与抗风控工程层（本地测试用）"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0.44",
    "aiosqlite>=0.21.0",
    "httpx>=0.28.1",
    "curl_cffi>=0.17.0",
    "loguru>=0.7.3",
    "numpy>=2.3.4",
    "pillow>=12.0.0",
    "pycryptodome>=3.23.0",
    "rsa>=4.9.1",
    "typing_extensions>=4.15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools]
py-modules = [
    "AesUtils",
    "RsaUtils",
    "TiShiNengError",
    "TiShiNengRunPathManage",
    "TiShiNengSdkBase",
    "TiShiNengSdkPrivate",
    "TiShiNengSdkPublic",
    "database",
    "deviceModel",
    "main",
    "models",
    "spiderServer",
    "step_buckets",
    "track_clean",
    "track_geo",
    "track_log",
    "track_metrics",
    "track_resample",
    "track_validate",
    "tsnClient",
    "tsnRunServer",
    "tsn_device",
    "tsn_egress",
    "tsn_environment",
    "tsn_face_provider",
    "tsn_face_schedule",
    "tsn_fingerprint",
    "tsn_payload",
    "tsn_policy",
    "tsn_routes",
    "tsn_runtime",
    "tsn_schedule",
    "tsn_signer",
    "tsn_track_sim",
    "validCountServer",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 200
target-version = "py311"
exclude = [".venv", "__pycache__", "audit", "face_images"]

[tool.ruff.lint]
# 先只保留"会出事"的规则：未定义名、未使用变量/导入、语法级问题。
# 老代码大量 typing.List 风格，不强推 UP 规则以免制造无意义 diff。
select = ["F", "E4", "E7", "E9", "W6", "B"]
ignore = ["E501", "E741", "B008", "B904", "E731"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
exclude = [".venv", "tests"]
